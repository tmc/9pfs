name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # verify runs the same gate as ./verify-local.sh on both macOS versions that
  # ship FSKit. It builds the extension unsigned: signing needs a provisioning
  # profile granting com.apple.developer.fskit.fsmodule, which CI does not have.
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sw_vers && xcodebuild -version
      - run: ./verify-local.sh "$RUNNER_TEMP/9pfs-build"

  # modules records the FSKit modules each macOS version ships, as reported to
  # a freshly built host app: exfat and msdos on 15, plus ftp on 26. That list
  # is what the status badge reads, so it is worth watching for change.
  #
  # It cannot answer whether macOS 15 hides third-party modules from the app.
  # pluginkit -a does not register the built extension on a runner, and nothing
  # here can enable one, so both versions report only Apple's own modules and
  # the interesting comparison never happens. Reproducing that needs a machine
  # where the extension is installed and toggled on.
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./build-appex.sh "$RUNNER_TEMP/9pfs-build"
      - name: probe
        run: |
          app=$RUNNER_TEMP/9pfs-build/NinePFSHost.app
          {
            echo '## ${{ matrix.os }}'
            echo '```'
            sw_vers
            echo '--- before registration'
            "$app/Contents/MacOS/NinePFSHost" --fskit-probe
            pluginkit -a "$app/Contents/Extensions/NinePFSExtension.appex" || true
            echo '--- pluginkit'
            pluginkit -mAvvv -p com.apple.fskit.fsmodule || true
            echo '--- after registration'
            "$app/Contents/MacOS/NinePFSHost" --fskit-probe
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
